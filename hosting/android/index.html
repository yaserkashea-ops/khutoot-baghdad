<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل تطبيق أندرويد — دليل خطوط بغداد</title>
  <meta name="description" content="تحميل تطبيق دليل خطوط بغداد لأجهزة أندرويد.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#053F3E">
  <link rel="icon" type="image/png" href="https://khutoot-baghdad.web.app/favicon-v19.png">
  <style>
    :root {
      --bg: #F4F8F7;
      --ink: #102221;
      --brand: #053F3E;
      --brand-soft: #0A5C5A;
      --muted: #4A6361;
      --card: #FFFFFF;
      --line: #D5E3E1;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 80% -10%, #C9E4E1 0%, transparent 55%),
        radial-gradient(900px 500px at -10% 110%, #DDECE9 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
    }
    main {
      max-width: 440px;
      margin: 0 auto;
      padding: 48px 20px 40px;
      text-align: center;
    }
    .mark {
      width: 88px;
      height: 88px;
      margin: 0 auto 18px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(5, 63, 62, 0.18);
      background: var(--card);
    }
    .mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.55rem;
      line-height: 1.35;
      color: var(--brand);
    }
    .sub {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px 18px 20px;
      text-align: right;
    }
    .panel p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.65;
    }
    .btn {
      display: block;
      width: 100%;
      text-decoration: none;
      text-align: center;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 14px 16px;
      border-radius: 12px;
      transition: background 0.15s ease;
    }
    .btn:hover { background: var(--brand-soft); }
    .hint {
      margin: 14px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.55;
      text-align: center;
    }
    .ios {
      margin-top: 22px;
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .ios a {
      color: var(--brand);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">
      <img src="https://khutoot-baghdad.web.app/icons/app-icon-512-v19.png" alt="دليل خطوط بغداد" width="88" height="88">
    </div>
    <h1>دليل خطوط بغداد</h1>
    <p class="sub">نسخة أندرويد للتحميل المباشر</p>

    <div class="panel">
      <p>هذا الرابط مخصص لمستخدمي <strong>أندرويد</strong> فقط. بعد التحميل افتح الملف وثبّت التطبيق (قد تحتاج السماح بالتثبيت من هذا المصدر).</p>
      <a class="btn" href="https://github.com/yaserkashea-ops/khutoot-baghdad/releases/download/android-v1.0.0/khutoot-baghdad-1.0.0.apk" download="khutoot-baghdad.apk">تحميل التطبيق لأندرويد</a>
      <p class="hint">الحجم تقريباً 24 ميغابايت · الإصدار 1.0.0</p>
    </div>

    <p class="ios">
      مستخدمو آيفون يستخدمون الرابط الأصلي:<br>
      <a href="https://khutoot-baghdad.web.app/">khutoot-baghdad.web.app</a>
    </p>
  </main>
</body>
</html>
