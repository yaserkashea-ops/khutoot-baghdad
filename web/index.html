<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="خطوط بغداد — تنظيم إعلانات خطوط النقل المشترك في بغداد.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#053F3E" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#02130D" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="خطوط بغداد">
  <link rel="apple-touch-icon" href="icons/app-icon-192-v18.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/app-icon-512-v18.png">

  <link rel="icon" type="image/png" href="favicon-v18.png"/>
  <title>خطوط بغداد</title>
  <link rel="manifest" href="manifest.json?v=20">
  <link rel="preload" href="flutter_bootstrap.js?v=20" as="script">

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #02130D;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    .masarat-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #02130D;
      color: #F0F5F4;
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
      z-index: 9999;
      transition: opacity 0.12s ease;
    }
    .masarat-boot img {
      width: 64px;
      height: 64px;
      border-radius: 14px;
    }
    .masarat-boot span {
      font-size: 17px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="masarat-boot" id="masarat-boot">
    <img src="favicon-v18.png" width="64" height="64" alt="خطوط بغداد" decoding="async" fetchpriority="high">
    <span id="masarat-boot-title">خطوط بغداد</span>
  </div>

  <script>
    (function () {
      var CACHE_BUST = 'v20';
      var ADMIN_ORIGIN = 'https://khutoot-baghdad-admin.web.app';

      function isAdminIntent() {
        var hash = (location.hash || '').replace(/^#/, '');
        var params = new URLSearchParams(location.search || '');
        return hash.indexOf('/admin') === 0
          || params.get('mode') === 'admin'
          || /(^|\/)admin(\/|$)/.test(location.pathname || '');
      }

      if (location.origin !== ADMIN_ORIGIN && isAdminIntent()) {
        location.replace(ADMIN_ORIGIN + '/');
        return;
      }

      window.addEventListener('hashchange', function () {
        if (location.origin !== ADMIN_ORIGIN && isAdminIntent()) {
          location.replace(ADMIN_ORIGIN + '/');
        }
      });

      const api = {
        deferred: null,
        canInstall: false,
        mode: 'app',
        isStandalone: function () {
          return window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;
        },
        isIos: function () {
          const ua = window.navigator.userAgent || '';
          return /iPad|iPhone|iPod/.test(ua)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        },
        isMobile: function () {
          return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '')
            || (navigator.maxTouchPoints > 1 && window.innerWidth < 900);
        },
        setMode: function () {},
        ensureAdminHash: function () {
          location.assign(ADMIN_ORIGIN + '/');
          return true;
        },
        isAdminEntry: function () {
          return false;
        },
        openAdminEntry: function () {
          location.assign(ADMIN_ORIGIN + '/');
          return true;
        },
        promptInstall: async function () {
          if (!api.deferred) return 'unavailable';
          api.deferred.prompt();
          const choice = await api.deferred.userChoice;
          api.deferred = null;
          api.canInstall = false;
          window.dispatchEvent(new CustomEvent('masarat-install-state'));
          return choice.outcome;
        },
        waitForPrompt: function (ms) {
          return new Promise(function (resolve) {
            if (api.deferred) {
              resolve(true);
              return;
            }
            var done = false;
            var timer = setTimeout(function () {
              if (done) return;
              done = true;
              resolve(false);
            }, ms || 2500);
            function onState() {
              if (done) return;
              if (!api.deferred) return;
              done = true;
              clearTimeout(timer);
              window.removeEventListener('masarat-install-state', onState);
              resolve(true);
            }
            window.addEventListener('masarat-install-state', onState);
          });
        }
      };
      window.__masaratPwa = api;

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        api.deferred = e;
        api.canInstall = true;
        window.dispatchEvent(new CustomEvent('masarat-install-state'));
      });

      window.addEventListener('appinstalled', function () {
        api.deferred = null;
        api.canInstall = false;
        window.dispatchEvent(new CustomEvent('masarat-install-state'));
      });

      function registerSw() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.register('sw.js?v=' + CACHE_BUST).catch(function () {});
      }

      // Register SW after first frame so it does not compete with Flutter boot.
      window.addEventListener('flutter-first-frame', function () {
        const el = document.getElementById('masarat-boot');
        if (el) {
          el.style.opacity = '0';
          setTimeout(function () { el.remove(); }, 120);
        }
        if (window.requestIdleCallback) {
          window.requestIdleCallback(registerSw, { timeout: 2000 });
        } else {
          setTimeout(registerSw, 800);
        }
      });
      setTimeout(function () {
        const el = document.getElementById('masarat-boot');
        if (el) el.remove();
        registerSw();
      }, 4000);
    })();
  </script>

  <script src="flutter_bootstrap.js?v=20"></script>
</body>
</html>
