  <noscript>
    <main style="max-width:40rem;margin:2rem auto;padding:1rem;font-family:Tahoma,sans-serif;line-height:1.7;direction:rtl;text-align:right">
      <h1>دليل خطوط بغداد</h1>
      <p>دليل خطوط بغداد موقع للبحث عن خطوط النقل المشترك في بغداد وإضافة خطك إلى الدليل.</p>
      <p>فعّل JavaScript لفتح الدليل الكامل.</p>

  <script>
    (function () {
      var CACHE_BUST = 'v175';
      var ADMIN_ORIGIN = 'https://khutoot-baghdad-admin.web.app';
      var VERSION_KEY = 'khutoot_build';

      function isAdminIntent() {
        var hash = (location.hash || '').replace(/^#/, '');
        var params = new URLSearchParams(location.search || '');
        return hash.indexOf('/admin') === 0
          || params.get('mode') === 'admin'
          || /(^|\/)admin(\/|$)/.test(location.pathname || '');
      }

      if (location.origin !== ADMIN_ORIGIN && isAdminIntent()) {
        location.replace(ADMIN_ORIGIN + '/');
        return;
      }

      window.addEventListener('hashchange', function () {
        if (location.origin !== ADMIN_ORIGIN && isAdminIntent()) {
          location.replace(ADMIN_ORIGIN + '/');
        }
      });

      const api = {
        deferred: null,
        canInstall: false,
        mode: 'app',
        isStandalone: function () {
          return window.matchMedia('(display-mode: standalone)').matches
            || window.matchMedia('(display-mode: minimal-ui)').matches
            || window.navigator.standalone === true;
        },
        isIos: function () {
          const ua = window.navigator.userAgent || '';
          return /iPad|iPhone|iPod/.test(ua)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        },
        isMobile: function () {
          var ua = navigator.userAgent || '';
          if (/Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
            return true;
          }
          if (navigator.maxTouchPoints > 1 && Math.min(window.innerWidth, window.screen.width) < 900) {
            return true;
          }
          return false;
        },
        setMode: function () {},
        ensureAdminHash: function () {
          location.assign(ADMIN_ORIGIN + '/');
          return true;
        },
        isAdminEntry: function () { return false; },
        openAdminEntry: function () {
          location.assign(ADMIN_ORIGIN + '/');
          return true;
        },
        _hitBtn: null,
        _ensureHitBtn: function () {
          if (api._hitBtn) return api._hitBtn;
          var b = document.createElement('button');
          b.id = 'masarat-pwa-install-hit';
          b.type = 'button';
          b.setAttribute('aria-label', 'تثبيت التطبيق');
          b.style.cssText = [
            'display:none',
            'position:fixed',
            'left:20px',
            'right:20px',
            'bottom:88px',
            'height:48px',
            'z-index:2147483646',
            'border:0',
            'border-radius:12px',
            'background:#053F3E',
            'color:#F4F8F7',
            'font-size:16px',
            'font-weight:700',
            'font-family:Tahoma,"Segoe UI",sans-serif',
            'cursor:pointer',
            'box-shadow:0 8px 24px rgba(5,63,62,0.28)',
            'direction:rtl'
          ].join(';');
          b.addEventListener('click', function () {
            // Must call prompt() synchronously under this click — no awaits first.
            if (api.deferred) {
              api.promptInstall().then(function (outcome) {
                window.dispatchEvent(new CustomEvent('masarat-install-outcome', {
                  detail: outcome || 'unavailable'
                }));
              });
              return;
            }
            // No deferred yet: prepare SW, then ask user to tap again.
            api.ensureReady().then(function (ready) {
              window.dispatchEvent(new CustomEvent('masarat-install-outcome', {
                detail: ready && api.deferred ? 'ready' : 'unavailable'
              }));
              window.dispatchEvent(new CustomEvent('masarat-install-state'));
            });
          });
          document.body.appendChild(b);
          api._hitBtn = b;
          return b;
        },
        showInstallButton: function (label, bottomPx) {
          var b = api._ensureHitBtn();
          b.textContent = label || 'تثبيت الآن';
          b.disabled = false;
          if (typeof bottomPx === 'number' && bottomPx > 0) {
            b.style.bottom = bottomPx + 'px';
          }
          b.style.display = 'block';
        },
        hideInstallButton: function () {
          if (api._hitBtn) api._hitBtn.style.display = 'none';
        },
        ensureReady: function () {
          if (!('serviceWorker' in navigator)) {
            return Promise.resolve(!!api.deferred);
          }
          return navigator.serviceWorker
            .register('/sw.js', { updateViaCache: 'none' })
            .then(function () { return navigator.serviceWorker.ready; })
            .then(function () {
              if (api.deferred) return true;
              return api.waitForPrompt(4000);
            })
            .catch(function () { return !!api.deferred; });
        },
        promptInstall: async function () {
          if (!api.deferred) return 'unavailable';
          // prompt() must run synchronously under a user gesture.
          var evt = api.deferred;
          try {
            evt.prompt();
          } catch (_) {
            return 'unavailable';
          }
          try {
            var choice = await evt.userChoice;
            api.deferred = null;
            api.canInstall = false;
            window.dispatchEvent(new CustomEvent('masarat-install-state'));
            if (choice && choice.outcome === 'accepted') {
              try { recordAppInstall('app'); } catch (_) {}
              return 'accepted';
            }
            return (choice && choice.outcome) || 'dismissed';
          } catch (_) {
            return 'dismissed';
          }
        },
        waitForPrompt: function (ms) {
          return new Promise(function (resolve) {
            if (api.deferred) { resolve(true); return; }
            var done = false;
            var timer = setTimeout(function () {
              if (done) return;
              done = true;
              resolve(false);
            }, ms || 2500);
            function onState() {
              if (done || !api.deferred) return;
              done = true;
              clearTimeout(timer);
              window.removeEventListener('masarat-install-state', onState);
              resolve(true);
            }
            window.addEventListener('masarat-install-state', onState);
          });
        },
        recordInstall: function (source) {
          return recordAppInstall(source || 'app');
        }
      };
      window.__masaratPwa = api;

      // Persist install counts even if Flutter is torn down mid-install.
      var SUPABASE_URL = 'https://plqhpbtkgforuvqferou.supabase.co';
      var SUPABASE_ANON = 'sb_publishable_SEVHXVQEu_yCz7dLNdIkCA_5H_odBRI';
      var INSTALL_KEY = 'khutoot_install_key';
      var INSTALL_RECORDED = 'khutoot_install_recorded_v1';

      function installKey() {
        try {
          var k = localStorage.getItem(INSTALL_KEY);
          if (k && k.length >= 8) return k;
          k = String(Date.now()) + '-' + Math.floor(Math.random() * 1e9);
          localStorage.setItem(INSTALL_KEY, k);
          return k;
        } catch (_) {
          return String(Date.now()) + '-fallback';
        }
      }

      function recordAppInstall(source) {
        try {
          if (localStorage.getItem(INSTALL_RECORDED) === '1') {
            return Promise.resolve(false);
          }
        } catch (_) {}
        var platform = api.isMobile() ? 'phone' : 'desktop';
        var body = JSON.stringify({
          p_install_key: installKey(),
          p_platform: platform,
          p_source: source === 'admin' ? 'admin' : 'app',
          p_user_agent: navigator.userAgent || null
        });
        return fetch(SUPABASE_URL + '/rest/v1/rpc/record_app_install', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON,
            'Authorization': 'Bearer ' + SUPABASE_ANON,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: body,
          keepalive: true
        }).then(function (res) {
          if (res && res.ok) {
            try { localStorage.setItem(INSTALL_RECORDED, '1'); } catch (_) {}
            return true;
          }
          return false;
        }).catch(function () { return false; });
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        api.deferred = e;
        api.canInstall = true;
        window.dispatchEvent(new CustomEvent('masarat-install-state'));
      });
      window.addEventListener('appinstalled', function () {
        api.deferred = null;
        api.canInstall = false;
        try { sessionStorage.setItem('khutoot_just_installed', '1'); } catch (_) {}
        try { localStorage.setItem('khutoot_just_installed_ls', '1'); } catch (_) {}
        recordAppInstall('app');
        window.dispatchEvent(new CustomEvent('masarat-install-state'));
      });

      // Already-installed PWA (iOS Add to Home Screen, returning users).
      if (api.isStandalone()) {
        recordAppInstall('app');
      }

      function registerSw() {
        if (!('serviceWorker' in navigator)) return;
        // Stable URL (no ?v=) — query-string SW scripts confuse some Chrome builds.
        navigator.serviceWorker
          .register('/sw.js', { updateViaCache: 'none' })
          .then(function () { return navigator.serviceWorker.ready; })
          .then(function () {
            window.dispatchEvent(new CustomEvent('masarat-install-state'));
          })
          .catch(function () {});
      }

      function urlBase64ToUint8Array(base64String) {
        var padding = '='.repeat((4 - (base64String.length % 4)) % 4);
        var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        var raw = atob(base64);
        var out = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
        return out;
      }

      // Web Push subscribe → phone notification tray (Chrome/Android + installed PWA).
      window.__khutootPushSubscribe = async function (vapidPublicKey) {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
        var reg = await navigator.serviceWorker.ready;
        try {
          var existing = await reg.pushManager.getSubscription();
          if (existing) await existing.unsubscribe();
        } catch (e) {}
        var sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(vapidPublicKey),
        });
        var json = sub.toJSON();
        return {
          endpoint: json.endpoint || '',
          p256dh: (json.keys && json.keys.p256dh) || '',
          auth: (json.keys && json.keys.auth) || '',
        };
      };

      window.__khutootPushUnsubscribe = async function () {
        if (!('serviceWorker' in navigator)) return;
        var reg = await navigator.serviceWorker.ready;
        var existing = await reg.pushManager.getSubscription();
        if (existing) await existing.unsubscribe();
      };

      function loadFlutter() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(CACHE_BUST);
        s.async = true;
        document.body.appendChild(s);
      }

      // Version / SW cleanup BEFORE Flutter paints — never reload after home is shown.
      (async function prepareBoot() {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) {
              var url = (r.active && r.active.scriptURL) ||
                (r.waiting && r.waiting.scriptURL) ||
                (r.installing && r.installing.scriptURL) || '';
              if (url.indexOf('flutter_service_worker') !== -1) {
                return r.unregister();
              }
              return Promise.resolve();
            }));
          }
          var res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
          var data = await res.json();
          var remote = (data && data.version) || '';
          var local = localStorage.getItem(VERSION_KEY) || '';
          // Force refresh when remote build differs from this HTML or from last boot.
          var stale = (remote && remote !== CACHE_BUST) ||
            (remote && local && remote !== local) ||
            (local && local !== CACHE_BUST);
          if (stale && !sessionStorage.getItem('khutoot_reloading')) {
            sessionStorage.setItem('khutoot_reloading', '1');
            if ('caches' in window) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
            if ('serviceWorker' in navigator) {
              var all = await navigator.serviceWorker.getRegistrations();
              await Promise.all(all.map(function (r) { return r.unregister(); }));
            }
            if (remote) localStorage.setItem(VERSION_KEY, remote);
            else localStorage.setItem(VERSION_KEY, CACHE_BUST);
            var url = new URL(location.href);
            url.searchParams.set('_v', remote || CACHE_BUST);
            url.searchParams.set('_t', String(Date.now()));
            location.replace(url.toString());
            return;
          }
          if (remote) localStorage.setItem(VERSION_KEY, remote);
          else localStorage.setItem(VERSION_KEY, CACHE_BUST);
          sessionStorage.removeItem('khutoot_reloading');
        } catch (_) {}
        // Do NOT register our SW before Flutter boots — Flutter's bootstrap
        // sees any existing SW and tries to activate flutter_service_worker,
        // which can hang forever on the splash screen.
        loadFlutter();
      })();

      window.addEventListener('flutter-first-frame', function () {
        const el = document.getElementById('masarat-boot');
        if (el) {
          el.style.opacity = '0';
          setTimeout(function () { el.remove(); }, 80);
        }
        if (window.requestIdleCallback) {
          window.requestIdleCallback(function () { registerSw(); }, { timeout: 1500 });
        } else {
          setTimeout(registerSw, 400);
        }
      });

      // Failsafe: never leave users on the green splash forever.
      setTimeout(function () {
        var el = document.getElementById('masarat-boot');
        if (el) {
          el.style.opacity = '0';
          setTimeout(function () { if (el.parentNode) el.remove(); }, 80);
        }
        try { registerSw(); } catch (_) {}
      }, 12000);
    })();
  </script>
