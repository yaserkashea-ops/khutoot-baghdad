<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="لوحة تحكم دليل خطوط بغداد — إدارة الإعلانات والطلبات.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#053F3E" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#F4F8F7" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="دليل خطوط بغداد">
  <link rel="apple-touch-icon" href="icons/app-icon-192-v19.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/app-icon-512-v19.png">

  <link rel="icon" type="image/png" href="favicon-v19.png"/>
  <title>لوحة تحكم دليل خطوط بغداد</title>
  <link rel="manifest" href="manifest-admin.json">
  <link rel="dns-prefetch" href="https://plqhpbtkgforuvqferou.supabase.co">
  <link rel="preconnect" href="https://plqhpbtkgforuvqferou.supabase.co" crossorigin>
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F4F8F7;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    .masarat-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #F4F8F7;
      color: #102221;
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
      z-index: 9999;
      transition: opacity 0.12s ease;
    }
    .masarat-boot img {
      width: 64px;
      height: 64px;
      border-radius: 14px;
    }
    .masarat-boot span {
      font-size: 17px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="masarat-boot" id="masarat-boot">
    <img src="favicon-v19.png" width="64" height="64" alt="دليل خطوط بغداد" decoding="async" fetchpriority="high">
    <span id="masarat-boot-title">لوحة التحكم</span>
  </div>

  <script>
    (function () {
      var CACHE_BUST = 'v175';
      var VERSION_KEY = 'khutoot_admin_build';

      const api = {
        deferred: null,
        canInstall: false,
        mode: 'admin',
        isStandalone: function () {
          return window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;
        },
        isIos: function () {
          const ua = window.navigator.userAgent || '';
          return /iPad|iPhone|iPod/.test(ua)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        },
        isMobile: function () {
          return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '')
            || (navigator.maxTouchPoints > 1 && window.innerWidth < 900);
        },
        setMode: function () {},
        ensureAdminHash: function () { return false; },
        isAdminEntry: function () { return true; },
        openAdminEntry: function () { return false; },
        _hitBtn: null,
        _ensureHitBtn: function () {
          if (api._hitBtn) return api._hitBtn;
          var b = document.createElement('button');
          b.id = 'masarat-pwa-install-hit';
          b.type = 'button';
          b.setAttribute('aria-label', 'تثبيت لوحة التحكم');
          b.style.cssText = [
            'display:none',
            'position:fixed',
            'left:20px',
            'right:20px',
            'bottom:88px',
            'height:48px',
            'z-index:2147483646',
            'border:0',
            'border-radius:12px',
            'background:#053F3E',
            'color:#F4F8F7',
            'font-size:16px',
            'font-weight:700',
            'font-family:Tahoma,"Segoe UI",sans-serif',
            'cursor:pointer',
            'box-shadow:0 8px 24px rgba(5,63,62,0.28)',
            'direction:rtl'
          ].join(';');
          b.addEventListener('click', function () {
            api.promptInstall().then(function (outcome) {
              window.dispatchEvent(new CustomEvent('masarat-install-outcome', {
                detail: outcome || 'unavailable'
              }));
            });
          });
          document.body.appendChild(b);
          api._hitBtn = b;
          return b;
        },
        showInstallButton: function (label, bottomPx) {
          var b = api._ensureHitBtn();
          b.textContent = label || 'تثبيت الآن';
          if (typeof bottomPx === 'number' && bottomPx > 0) {
            b.style.bottom = bottomPx + 'px';
          }
          b.style.display = 'block';
        },
        hideInstallButton: function () {
          if (api._hitBtn) api._hitBtn.style.display = 'none';
        },
        promptInstall: async function () {
          if (!api.deferred) return 'unavailable';
          var evt = api.deferred;
          try {
            evt.prompt();
          } catch (_) {
            return 'unavailable';
          }
          try {
            var choice = await evt.userChoice;
            api.deferred = null;
            api.canInstall = false;
            window.dispatchEvent(new CustomEvent('masarat-install-state'));
            return (choice && choice.outcome) || 'dismissed';
          } catch (_) {
            return 'dismissed';
          }
        },
        waitForPrompt: function (ms) {
          return new Promise(function (resolve) {
            if (api.deferred) { resolve(true); return; }
            var done = false;
            var timer = setTimeout(function () {
              if (done) return;
              done = true;
              resolve(false);
            }, ms || 2500);
            function onState() {
              if (done || !api.deferred) return;
              done = true;
              clearTimeout(timer);
              window.removeEventListener('masarat-install-state', onState);
              resolve(true);
            }
            window.addEventListener('masarat-install-state', onState);
          });
        }
      };
      window.__masaratPwa = api;

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        api.deferred = e;
        api.canInstall = true;
        window.dispatchEvent(new CustomEvent('masarat-install-state'));
      });
      window.addEventListener('appinstalled', function () {
        api.deferred = null;
        api.canInstall = false;
        window.dispatchEvent(new CustomEvent('masarat-install-state'));
      });

      function registerSw() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker
          .register('/sw.js', { updateViaCache: 'none' })
          .catch(function () {});
      }

      function loadFlutter() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(CACHE_BUST);
        s.async = true;
        document.body.appendChild(s);
      }

      (async function prepareBoot() {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) {
              var url = (r.active && r.active.scriptURL) ||
                (r.waiting && r.waiting.scriptURL) ||
                (r.installing && r.installing.scriptURL) || '';
              if (url.indexOf('flutter_service_worker') !== -1) {
                return r.unregister();
              }
              return Promise.resolve();
            }));
          }
          var res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
          var data = await res.json();
          var remote = (data && data.version) || '';
          var local = localStorage.getItem(VERSION_KEY) || '';
          var stale = (remote && remote !== CACHE_BUST) ||
            (remote && local && remote !== local) ||
            (local && local !== CACHE_BUST);
          if (stale && !sessionStorage.getItem('khutoot_admin_reloading')) {
            sessionStorage.setItem('khutoot_admin_reloading', '1');
            if ('caches' in window) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
            if ('serviceWorker' in navigator) {
              var all = await navigator.serviceWorker.getRegistrations();
              await Promise.all(all.map(function (r) { return r.unregister(); }));
            }
            if (remote) localStorage.setItem(VERSION_KEY, remote);
            else localStorage.setItem(VERSION_KEY, CACHE_BUST);
            var url = new URL(location.href);
            url.searchParams.set('_v', remote || CACHE_BUST);
            url.searchParams.set('_t', String(Date.now()));
            location.replace(url.toString());
            return;
          }
          if (remote) localStorage.setItem(VERSION_KEY, remote);
          else localStorage.setItem(VERSION_KEY, CACHE_BUST);
          sessionStorage.removeItem('khutoot_admin_reloading');
        } catch (_) {}
        loadFlutter();
      })();

      window.addEventListener('flutter-first-frame', function () {
        const el = document.getElementById('masarat-boot');
        if (el) {
          el.style.opacity = '0';
          setTimeout(function () { el.remove(); }, 80);
        }
        setTimeout(registerSw, 400);
      });
      setTimeout(function () {
        const el = document.getElementById('masarat-boot');
        if (el) el.remove();
        registerSw();
      }, 8000);
    })();
  </script>
</body>
</html>
