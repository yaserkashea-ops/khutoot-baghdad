<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="لوحة تحكم خطوط بغداد — إدارة الإعلانات والاستيراد والبلاغات.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#053F3E" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#02130D" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="تحكم خطوط">
  <link rel="apple-touch-icon" href="icons/app-icon-192-v18.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/app-icon-512-v18.png">

  <link rel="icon" type="image/png" href="favicon-v18.png"/>
  <title>لوحة تحكم خطوط بغداد</title>
  <link rel="manifest" href="manifest-admin.json">
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #02130D;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    .masarat-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #02130D;
      color: #F0F5F4;
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
      z-index: 9999;
      transition: opacity 0.12s ease;
    }
    .masarat-boot img {
      width: 64px;
      height: 64px;
      border-radius: 14px;
    }
    .masarat-boot span {
      font-size: 17px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="masarat-boot" id="masarat-boot">
    <img src="favicon-v18.png" width="64" height="64" alt="تحكم خطوط" decoding="async" fetchpriority="high">
    <span id="masarat-boot-title">تحكم خطوط</span>
  </div>

  <script>
    (function () {
      var CACHE_BUST = 'v28';
      var VERSION_KEY = 'khutoot_admin_build';

      (async function ensureFreshBuild() {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) {
              var url = (r.active && r.active.scriptURL) ||
                (r.waiting && r.waiting.scriptURL) ||
                (r.installing && r.installing.scriptURL) || '';
              if (url.indexOf('flutter_service_worker') !== -1) {
                return r.unregister();
              }
              return Promise.resolve();
            }));
          }
          var res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
          var data = await res.json();
          var remote = (data && data.version) || '';
          var local = localStorage.getItem(VERSION_KEY) || '';
          if (remote && local && remote !== local && !sessionStorage.getItem('khutoot_admin_reloading')) {
            sessionStorage.setItem('khutoot_admin_reloading', '1');
            if ('caches' in window) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
            if ('serviceWorker' in navigator) {
              var all = await navigator.serviceWorker.getRegistrations();
              await Promise.all(all.map(function (r) { return r.unregister(); }));
            }
            localStorage.setItem(VERSION_KEY, remote);
            location.reload();
            return;
          }
          if (remote) localStorage.setItem(VERSION_KEY, remote);
          sessionStorage.removeItem('khutoot_admin_reloading');
        } catch (_) {}
      })();

      const api = {
        deferred: null,
        canInstall: false,
        mode: 'admin',
        isStandalone: function () {
          return window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;
        },
        isIos: function () {
          const ua = window.navigator.userAgent || '';
          return /iPad|iPhone|iPod/.test(ua)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        },
        isMobile: function () {
          return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '')
            || (navigator.maxTouchPoints > 1 && window.innerWidth < 900);
        },
        setMode: function () {},
        ensureAdminHash: function () {
          return false;
        },
        isAdminEntry: function () {
          return true;
        },
        openAdminEntry: function () {
          return false;
        },
        promptInstall: async function () {
          if (!api.deferred) return 'unavailable';
          api.deferred.prompt();
          const choice = await api.deferred.userChoice;
          api.deferred = null;
          api.canInstall = false;
          window.dispatchEvent(new CustomEvent('masarat-install-state'));
          return choice.outcome;
        },
        waitForPrompt: function (ms) {
          return new Promise(function (resolve) {
            if (api.deferred) {
              resolve(true);
              return;
            }
            var done = false;
            var timer = setTimeout(function () {
              if (done) return;
              done = true;
              resolve(false);
            }, ms || 2500);
            function onState() {
              if (done) return;
              if (!api.deferred) return;
              done = true;
              clearTimeout(timer);
              window.removeEventListener('masarat-install-state', onState);
              resolve(true);
            }
            window.addEventListener('masarat-install-state', onState);
          });
        }
      };
      window.__masaratPwa = api;

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        api.deferred = e;
        api.canInstall = true;
        window.dispatchEvent(new CustomEvent('masarat-install-state'));
      });

      window.addEventListener('appinstalled', function () {
        api.deferred = null;
        api.canInstall = false;
        window.dispatchEvent(new CustomEvent('masarat-install-state'));
      });

      function registerSw() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.register('sw.js?v=' + CACHE_BUST).catch(function () {});
      }

      window.addEventListener('flutter-first-frame', function () {
        const el = document.getElementById('masarat-boot');
        if (el) {
          el.style.opacity = '0';
          setTimeout(function () { el.remove(); }, 120);
        }
        if (window.requestIdleCallback) {
          window.requestIdleCallback(registerSw, { timeout: 2000 });
        } else {
          setTimeout(registerSw, 800);
        }
      });
      setTimeout(function () {
        const el = document.getElementById('masarat-boot');
        if (el) el.remove();
        registerSw();
      }, 4000);
    })();
  </script>

  <script src="flutter_bootstrap.js"></script>
</body>
</html>
