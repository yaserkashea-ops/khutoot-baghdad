<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>تحديث خطوط بغداد</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #02130D;
      color: #EDE8E0;
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
      padding: 24px;
      text-align: center;
    }
    p { opacity: 0.85; line-height: 1.7; max-width: 28rem; }
  </style>
</head>
<body>
  <div>
    <p id="msg">جاري إصلاح التحديث…</p>
  </div>
  <script>
    (async function () {
      var msg = document.getElementById('msg');
      try {
        if ('caches' in window) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
      } catch (e) {}
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
      } catch (e) {}
      try {
        localStorage.clear();
        sessionStorage.clear();
      } catch (e) {}
      msg.textContent = 'تم الإصلاح. افتح الرابط الآن:';
      // One redirect only — no reload loops.
      setTimeout(function () {
        location.replace('https://khutoot-baghdad.web.app/');
      }, 400);
    })();
  </script>
</body>
</html>
