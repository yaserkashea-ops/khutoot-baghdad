<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>تحديث خطوط بغداد</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121824;
      color: #EDE8E0;
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
      padding: 24px;
      text-align: center;
    }
    p { opacity: 0.8; line-height: 1.6; }
  </style>
</head>
<body>
  <div>
    <p id="msg">جاري مسح النسخة القديمة وتحميل التحديث…</p>
  </div>
  <script>
    (async function () {
      var msg = document.getElementById('msg');
      try {
        if ('caches' in window) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
      } catch (e) {}
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
      } catch (e) {}
      try {
        localStorage.removeItem('masarat-app-version');
        localStorage.removeItem('masarat-admin-app-version');
        sessionStorage.clear();
      } catch (e) {}
      msg.textContent = 'تم. يتم فتح النسخة الجديدة…';
      location.replace('/index.html?fresh=' + Date.now());
    })();
  </script>
</body>
</html>
